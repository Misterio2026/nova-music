<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Music 2.0</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="background"></div>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logoCircle">🎵</div>
            <h2>NOVA</h2>
        </div>

        <div class="menu">

            <button class="active">
                <i class="fa-solid fa-house"></i>
                Inicio
            </button>

            <button>
                <i class="fa-solid fa-heart"></i>
                Favoritos
            </button>

            <button>
                <i class="fa-solid fa-music"></i>
                Biblioteca
            </button>

            <button onclick="document.getElementById('musicPicker').click()">
                <i class="fa-solid fa-folder-open"></i>
                Cargar Música
            </button>

        </div>

        <div class="searchBox">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                id="search"
                type="text"
                placeholder="Buscar canción...">

            <input
                id="musicPicker"
                type="file"
                accept="audio/*"
                multiple
                hidden>

        </div>

        <div class="songList" id="songList">
            <!-- Aquí aparecerán las canciones -->
        </div>

    </aside>

    <main class="main">

        <div class="cover">

            <div class="glow"></div>

            <img
                id="cover"
                src="https://placehold.co/500x500/png?text=Nova">

        </div>

        <h1 id="title">
            Bienvenido a Nova Music
        </h1>

        <p>
            Selecciona una canción para comenzar
        </p>

        <div class="visualizer">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>

    </main>

</div>

<footer>

    <div class="player">

        <button id="prev">
            <i class="fa-solid fa-backward"></i>
        </button>

        <button class="play" id="play">
            <i class="fa-solid fa-play"></i>
        </button>

        <button id="next">
            <i class="fa-solid fa-forward"></i>
        </button>

    </div>

    <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0">

    <div class="volume">

        <i class="fa-solid fa-volume-high"></i>

        <input id="volume" type="range" min="0" max="100" value="100">

    </div>

</footer>

<audio id="audio"></audio>

<script src="script.js"></script>

</body>
</html>
